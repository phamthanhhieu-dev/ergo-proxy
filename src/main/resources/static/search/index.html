<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Ergo Proxy</title>
    <link href="/common/style.css" rel="stylesheet" />
    <script src="/common/navigation.js" type="module"></script>
    <script src="/search/search.js" type="module"></script>
    <link href="/playback/dist/playback.css" rel="stylesheet" />
    <script src="/common/playback-launcher.js" type="module"></script>
</head>
<body data-page="main">
<header class="site-header">
    <a aria-label="Ergo Proxy — trang chính" class="brand" href="/">◈ ERGO PROXY</a>
</header>
<main>
    <div class="playback-launch" id="page-toolbar">
        <div>
            <button class="back-button secondary" hidden id="view-back" type="button">← Quay lại</button>
        </div>
        <div class="playback-actions">
            <button id="choose-video">▶ Chọn video
            </button
            >
            <button class="secondary" id="choose-folder">Chọn thư mục
            </button
            >
            <button class="secondary" id="server-library">Mở thư viện đã cấu hình</button>
        </div>
    </div>
    <p id="playback-status" role="status"></p>
    <div id="playback-root"></div>
    <div class="source-picker">
        <label for="anime-source"
        >Nguồn phim
            <select id="anime-source">
                <option value="reanime">ReAnime</option>
            </select>
        </label>
        <span id="source-description">Tìm kiếm và tải phim từ ReAnime • Phụ đề từ OpenSubtitles</span>
    </div>
    <div id="search-screen">
        <form id="search">
            <input
                aria-label="Tên anime hoặc đường dẫn"
                id="query"
                maxlength="200"
                placeholder="Tên anime hoặc link reanime.to…"
                required
            />
            <button>Tìm anime ↗</button>
        </form>
        <section aria-label="Kết quả tìm kiếm" class="results" id="results"></section>
    </div>
    <div aria-live="polite" id="message" role="status"></div>
    <footer class="contact-footer">
        <a href="https://github.com/phamthanhhieu-dev" rel="noopener noreferrer" target="_blank"
        >GitHub · phamthanhhieu-dev</a
        >
        <a href="mailto:pth29jan@gmail.com">pth29jan@gmail.com</a>
    </footer>
</main>
</body>
</html>
