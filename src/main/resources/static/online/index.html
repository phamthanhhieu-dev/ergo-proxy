<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Ergo Proxy</title>
    <link href="/common/style.css" rel="stylesheet" />
    <link href="/playback/dist/playback.css" rel="stylesheet" />
    <script src="/playback/dist/online.js" type="module"></script>
</head>
<body data-page="online">
<header class="site-header">
    <a aria-label="Ergo Proxy — trang chính" class="brand" href="/">◈ ERGO PROXY</a>
</header>
<main>
    <div class="playback-launch" id="page-toolbar">
        <div>
            <button class="back-button secondary" hidden id="view-back" type="button">← Quay lại</button>
        </div>
        <div class="playback-actions">
            <button id="choose-subs">Chọn thư mục phụ đề
            </button
            >
            <button class="secondary" id="download-page">Tải phim và phụ đề
            </button
            >
            <button class="secondary" id="server-subs">Quét thư viện đã cấu hình
            </button
            >
            <button class="secondary" id="online-fullscreen">Toàn màn hình</button>
        </div>
    </div>
    <p id="playback-status" role="status"></p>
    <div id="playback-root"></div>
    <div aria-live="polite" id="message" role="status"></div>
    <footer class="contact-footer">
        <a href="https://github.com/phamthanhhieu-dev" rel="noopener noreferrer" target="_blank"
        >GitHub · phamthanhhieu-dev</a
        >
        <a href="mailto:pth29jan@gmail.com">pth29jan@gmail.com</a>
    </footer>
</main>
</body>
</html>
