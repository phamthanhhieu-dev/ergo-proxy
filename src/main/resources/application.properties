server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
anime.python=${ANIME_PYTHON}
anime.storage=${ANIME_STORAGE}
spring.mvc.async.request-timeout=${ANIME_STREAM_TIMEOUT:21600000}
logging.level.vn.anime=${ANIME_LOG_LEVEL}
opensubtitles.api-key=${OPENSUBTITLES_API_KEY}
opensubtitles.username=${OPENSUBTITLES_USERNAME}
opensubtitles.password=${OPENSUBTITLES_PASSWORD}
opensubtitles.token=${OPENSUBTITLES_TOKEN}
spring.application.name=${SPRING_APPLICATION_NAME:ergo-proxy}
spring.messages.basename=${SPRING_MESSAGES_BASENAME:message/message}
spring.messages.encoding=${SPRING_MESSAGES_ENCODING:UTF-8}
spring.messages.fallback-to-system-locale=${SPRING_MESSAGES_FALLBACK_TO_SYSTEM_LOCALE:false}
spring.banner.location=${SPRING_BANNER_LOCATION:classpath:log/banner.txt}
logging.config=${LOGGING_CONFIG:classpath:log/logback-spring.xml}
app.logging.api.enabled=${API_LOGGING_ENABLED:true}
app.logging.api.max-body-size=${API_LOGGING_MAX_BODY_SIZE:16384}
reanime.api.url=${REANIME_API_URL}
opensubtitles.api.url=${OPENSUBTITLES_API_URL}
flixcloud.api.url=${FLIXCLOUD_API_URL}
logging.level.com.ergoproxy=${ANIME_LOG_LEVEL:INFO}

# Thư viện video local/LAN dùng cùng ứng dụng
spring.main.headless=${SPRING_MAIN_HEADLESS:false}
playback.library-root=${PLAYBACK_LIBRARY_ROOT:${user.home}/Videos}
playback.max-files=${PLAYBACK_MAX_FILES:10000}
