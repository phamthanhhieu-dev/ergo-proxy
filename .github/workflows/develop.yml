# One Linux x64 self-hosted runner with the unique label ergo-proxy for all three jobs.
# Requires Docker Engine + Compose >=2.30 + recent Buildx, Python3 and Bash.
# Create GitHub Environment develop with ONE secret ENV_FILE containing the complete .env text.
# For Docker use ANIME_PYTHON=/opt/venv/bin/python, ANIME_STORAGE=/data/downloads,
# PLAYBACK_LIBRARY_ROOT=/media/anime, SERVER_ADDRESS=0.0.0.0, SPRING_MAIN_HEADLESS=true.
# ERGO_LIBRARY_PATH and ERGO_DOWNLOADS_PATH in ENV_FILE are absolute paths on the Docker host.
# Compose DOCKER_* aliases have Linux defaults; do not put Windows paths into those aliases.
# Quote literal passwords/tokens containing $ with single quotes using Compose .env syntax.
name: Ergo Proxy develop
on:
    push:
        branches: [ develop ]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ergo-proxy-develop
    cancel-in-progress: false
env:
    APP_IMAGE: ergo-proxy/app:${{ github.sha }}-${{ github.run_id }}
jobs:
    build:
        if: github.ref == 'refs/heads/develop'
        runs-on: [ self-hosted, linux, x64, ergo-proxy ]
        timeout-minutes: 30
        steps:
            -   uses: actions/checkout@v6
                with:
                    persist-credentials: false
            -   name: Build with reusable bounded cache
                shell: bash
                run: |
                    set -euo pipefail
                    config="$(mktemp "$RUNNER_TEMP/ergo-proxy-buildkit.XXXXXX")"
                    trap 'rm -f -- "$config"' EXIT
                    cat > "$config" <<'TOML'
                    [worker.oci]
                      gc = true
                      reservedSpace = "512MB"
                      maxUsedSpace = "2GB"
                      minFreeSpace = "2GB"
                    [[worker.oci.gcpolicy]]
                      all = true
                      reservedSpace = "512MB"
                      maxUsedSpace = "2GB"
                      minFreeSpace = "2GB"
                    TOML
                    if ! docker buildx inspect ergo-proxy >/dev/null 2>&1; then
                      docker buildx create --name ergo-proxy --driver docker-container --buildkitd-config "$config"
                    fi
                    docker buildx inspect ergo-proxy --bootstrap >/dev/null
                    docker buildx build --builder ergo-proxy --file Dockerfile --tag "$APP_IMAGE" \
                      --label "org.opencontainers.image.revision=$GITHUB_SHA" --pull --load .

    deploy:
        needs: build
        runs-on: [ self-hosted, linux, x64, ergo-proxy ]
        environment: develop
        timeout-minutes: 5
        steps:
            -   uses: actions/checkout@v6
                with:
                    persist-credentials: false
            -   name: Deploy and wait for healthy application
                shell: bash
                env:
                    ENV_FILE: ${{ secrets.ENV_FILE }}
                run: |
                    set -euo pipefail
                    : "${ENV_FILE:?Set the GitHub Secret ENV_FILE to the deployment .env content}"
                    umask 077
                    env_file="$(mktemp "$RUNNER_TEMP/.env.ergo-proxy.$GITHUB_RUN_ID.XXXXXX")"
                    trap 'rm -f -- "$env_file"' EXIT
                    trap 'exit 130' INT
                    trap 'exit 143' TERM
                    # Do not source/eval the secret, print it, or run compose config.
                    printf '%s\n' "$ENV_FILE" > "$env_file"
                    unset ENV_FILE
                    compose=(docker compose --env-file "$env_file" -f docker-compose.yml -p ergo-proxy)
                    container="$("${compose[@]}" ps -aq be)"
                    if [[ -n "$container" ]]; then
                      docker inspect --format '{{.Image}}' "$container" > "$RUNNER_TEMP/ergo-proxy-$GITHUB_RUN_ID.previous"
                    fi
                    "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 180

    clean:
        needs: [ build, deploy ]
        if: ${{ always() && github.ref == 'refs/heads/develop' }}
        runs-on: [ self-hosted, linux, x64, ergo-proxy ]
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v6
                with:
                    persist-credentials: false
            -   name: Remove only obsolete ergo-proxy images and bounded builder cache
                shell: bash
                run: |
                    set -euo pipefail
                    # Fallback if deploy was interrupted before its EXIT trap ran.
                    find "${RUNNER_TEMP:?}" -maxdepth 1 -type f -name ".env.ergo-proxy.$GITHUB_RUN_ID.*" -delete
                    python3 <<'PY'
                    import json, os, subprocess
                    from pathlib import Path
                    def docker(*args):
                        return subprocess.check_output(['docker', *args], text=True).strip()
                    state = Path(os.environ['RUNNER_TEMP']) / ('ergo-proxy-' + os.environ['GITHUB_RUN_ID'] + '.previous')
                    previous = state.read_text().strip() if state.exists() else ''
                    # Remove stopped containers only from this project, never running ones.
                    for container in docker('ps', '-aq', '--filter', 'label=com.docker.compose.project=ergo-proxy').split():
                        info = json.loads(docker('inspect', container))[0]
                        if info['State']['Status'] in ('exited', 'dead', 'created'):
                            subprocess.run(['docker', 'container', 'rm', container], check=True)
                    protected = {previous}
                    used_tags = set()
                    containers = docker('ps', '-aq').split()
                    if containers:
                        for item in json.loads(docker('inspect', *containers)):
                            protected.add(item['Image'])
                            used_tags.add(item['Config']['Image'])
                    images = set(docker('image', 'ls', '--no-trunc', '-q', '--filter', 'label=io.ergo-proxy.managed=true').split())
                    for image in images:
                        info = json.loads(docker('image', 'inspect', image))[0]
                        tags = info.get('RepoTags') or []
                        own_tags = sorted(tag for tag in tags if tag.startswith('ergo-proxy/app:'))
                        keep = used_tags.intersection(own_tags)
                        if image == previous and own_tags and not keep:
                            keep.add(own_tags[-1])
                        for tag in set(own_tags) - keep:
                            subprocess.run(['docker', 'image', 'rm', tag], check=True)
                        if image not in protected and not tags:
                            subprocess.run(['docker', 'image', 'rm', image], check=True)
                    state.unlink(missing_ok=True)
                    PY
                    if docker buildx inspect ergo-proxy >/dev/null 2>&1; then
                      docker buildx prune --builder ergo-proxy --force --max-used-space 2gb --reserved-space 512mb --min-free-space 2gb
                    fi
